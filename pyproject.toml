[project]
name = "amora-dating-bot"
version = "0.1.0"
description = "Cross-platform (Telegram + Discord) dating bot with face-checked profiles"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "discord.py>=2.4,<3",
    "SQLAlchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "redis>=5.2",
    "pydantic-settings>=2.7",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "Pillow>=11.0",
    "ImageHash>=4.3",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amora*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
