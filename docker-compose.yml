services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://spark:${POSTGRES_PASSWORD:-spark}@db:5432/spark
      REDIS_URL: redis://redis:6379/0
    volumes:
      - bot-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spark}
      POSTGRES_DB: spark
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  bot-data:
  db-data:
  redis-data:
